name: deploy-oxyplotblazor-nuget

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish v[0-9]+.[0-9]+.[0-9]+*'
        required: true
        default: ''
        type: string
  push:
    tags: 
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  get-version:
    name: Get version to deploy
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0
    outputs:
      VERSION: ${{ steps.output-version.outputs.VERSION }}
    steps:
    - name: Set tag from input
      if: ${{ github.event.inputs.version != '' }}
      env:
        TAG: ${{ github.event.inputs.version }}
      run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV

    - name: Set version variable from tag
      if: ${{ github.ref_type == 'tag' }}
      env:
        TAG: ${{ github.ref_name }}
      run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV

    - name: VERSION to job output
      id: output-version
      run: |
        echo "VERSION=${{ env.VERSION }}" >> $GITHUB_OUTPUT

  # nothing is published that does not build and pass the tests
  build-and-test:
    name: Build and test
    needs: get-version
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: 'refs/tags/v${{ needs.get-version.outputs.VERSION }}'

  deploy-nuget:
    name: Deploy package to nuget.org
    needs: [get-version, build-and-test]
    runs-on: ubuntu-latest
    # the package is pushed with nuget.org trusted publishing, no long lived api key is stored here.
    # the policy on nuget.org is bound to repository owner, repository and the file name of this workflow,
    # so renaming this file breaks publishing until the policy is updated.
    permissions:
      id-token: write   # required to let github issue the OIDC token for NuGet/login
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: 'refs/tags/v${{ needs.get-version.outputs.VERSION }}'
    - name: Setup dotnet version
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
    - name: Pack nuget package
      run: |
        dotnet build -c Release /p:AssemblyVersion=${{ needs.get-version.outputs.VERSION }} /p:Version=${{ needs.get-version.outputs.VERSION }}
        dotnet pack -c Release --output nupkgs /p:PackageVersion=${{ needs.get-version.outputs.VERSION }} /p:AssemblyVersion=${{ needs.get-version.outputs.VERSION }} /p:Version=${{ needs.get-version.outputs.VERSION }}
      working-directory: ./OxyPlot.Blazor
    # exchange the github OIDC token for an api key that is valid for one hour,
    # therefore this runs directly before the push and not earlier
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the email address
    - name: Publish nuget package
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      working-directory: ./OxyPlot.Blazor